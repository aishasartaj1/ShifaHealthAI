substitutions:
  _VITE_API_BASE_URL: "http://localhost:8000" # overridden at submit time with --substitutions

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - --build-arg
      - VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
