server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routes (e.g. /admin/agents) must fall back to index.html -
    # nginx doesn't know about them, only the SPA's router does.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
