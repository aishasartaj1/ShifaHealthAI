[project]
name = "shifahealth-ingestion-signal-function"
version = "0.1.0"
description = "Cloud Function: publishes an ingestion signal when a file lands in the raw bucket"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
